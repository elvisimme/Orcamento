<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orçamento da Família</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<style>
:root{
  --papel:#F2F5F4; --superficie:#FFFFFF; --tinta:#17302F; --tinta2:#566C6A; --linha:#DCE4E2;
  --marca:#1E5B57; --marca-suave:#E2EEEC;
  --previsto:#8A97A3; --fechada:#D99A12; --conferido:#2E7D5B; --despesa:#B4463A; --receita:#2E7D5B; --invest:#3D6FB6; --divida:#8C4A9E;
  --sombra:0 1px 2px rgba(23,48,47,.06),0 4px 14px rgba(23,48,47,.04);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --papel:#0E1918; --superficie:#152322; --tinta:#E6EFEE; --tinta2:#9DB3B0; --linha:#26403E;
  --marca:#6FC2B9; --marca-suave:#1B3432; --previsto:#7D8B97; --fechada:#E8B23A; --conferido:#5CC08E;
  --despesa:#E37A6E; --receita:#5CC08E; --invest:#7EA8E6; --divida:#C38AD3; --sombra:none; color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#0E1918; --superficie:#152322; --tinta:#E6EFEE; --tinta2:#9DB3B0; --linha:#26403E;
  --marca:#6FC2B9; --marca-suave:#1B3432; --previsto:#7D8B97; --fechada:#E8B23A; --conferido:#5CC08E;
  --despesa:#E37A6E; --receita:#5CC08E; --invest:#7EA8E6; --divida:#C38AD3; --sombra:none; color-scheme:dark;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--papel);color:var(--tinta);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--papel)}
h1,h2,h3{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;margin:0}
h1{font-size:1.35rem} h2{font-size:1.1rem;margin-bottom:.6rem} h3{font-size:1rem}
a{color:var(--marca)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--marca);outline-offset:2px}
svg.ic{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}

/* estrutura: menu lateral + conteúdo */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.app>div{min-width:0}
aside.menu{position:sticky;top:0;height:100vh;background:var(--superficie);border-right:1px solid var(--linha);display:flex;flex-direction:column;gap:1.2rem;padding:1.1rem .8rem}
.marca{display:flex;align-items:center;gap:.6rem;padding:.2rem .5rem;font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;font-size:1.05rem;line-height:1.2}
.marca .selo-casa{width:2.3rem;height:2.3rem;border-radius:10px;background:var(--marca);color:var(--superficie);display:grid;place-items:center;font-size:1.2rem}
nav.abas{display:flex;flex-direction:column;gap:.15rem}
nav.abas button{display:flex;align-items:center;gap:.75rem;padding:.62rem .75rem;border:0;border-radius:9px;background:none;color:var(--tinta2);cursor:pointer;text-align:left}
nav.abas button:hover{background:var(--papel);color:var(--tinta)}
nav.abas button[aria-selected="true"]{background:var(--marca-suave);color:var(--marca);font-weight:600}
nav.abas .c{display:none}
.usuario{margin-top:auto;padding:.6rem;font-size:.82rem;color:var(--tinta2);border-top:1px solid var(--linha);overflow-wrap:anywhere}
header.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:1rem;padding:.85rem 2rem;background:color-mix(in srgb,var(--papel) 86%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--linha)}
.mesnav{display:flex;align-items:center;gap:.3rem;margin-left:auto}
.mesnav span{min-width:7.5rem;text-align:center;font-weight:600;text-transform:capitalize}
.ico{display:inline-grid;place-items:center;background:var(--superficie);border:1px solid var(--linha);border-radius:8px;width:2.2rem;height:2.2rem;cursor:pointer;color:var(--tinta)}
main{padding:1.5rem 2rem 3rem}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside.menu{position:fixed;inset:auto 0 0 0;top:auto;height:auto;z-index:20;flex-direction:row;padding:.3rem .3rem calc(.3rem + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--linha)}
  .marca,.usuario{display:none}
  nav.abas{flex-direction:row;width:100%;justify-content:space-around}
  nav.abas button{flex:1;flex-direction:column;gap:.15rem;padding:.35rem .1rem;font-size:.7rem;text-align:center}
  nav.abas button svg.ic{width:1.4rem;height:1.4rem}
  nav.abas .l{display:none} nav.abas .c{display:inline}
  header.barra{padding:.7rem 1rem} main{padding:1rem 1rem 6rem}
}

/* blocos */
.painel{background:var(--superficie);border:1px solid var(--linha);border-radius:14px;padding:1.15rem 1.25rem;box-shadow:var(--sombra);margin-bottom:1.25rem;min-width:0}
.colunas{display:grid;gap:0 1.25rem;grid-template-columns:minmax(0,1fr)}
@media (min-width:1350px){.colunas{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
.grade{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.kpis{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-bottom:1.25rem}
.kpi{background:var(--superficie);border:1px solid var(--linha);border-radius:14px;padding:1rem 1.1rem;box-shadow:var(--sombra);display:flex;gap:.85rem;align-items:flex-start;min-width:0}
.bolha{width:2.6rem;height:2.6rem;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--marca-suave);color:var(--marca)}
.bolha svg.ic{width:1.35rem;height:1.35rem}
.bolha.r{background:color-mix(in srgb,var(--receita) 14%,transparent);color:var(--receita)}
.bolha.d{background:color-mix(in srgb,var(--despesa) 14%,transparent);color:var(--despesa)}
.bolha.i{background:color-mix(in srgb,var(--invest) 15%,transparent);color:var(--invest)}
.bolha.v{background:color-mix(in srgb,var(--divida) 15%,transparent);color:var(--divida)}
.kpi small{display:block;color:var(--tinta2);font-size:.83rem}
.kpi strong{display:block;font-size:1.3rem;line-height:1.25;white-space:nowrap}
.kpi .sutil{display:block;margin-top:.15rem}
@media (max-width:600px){.kpis{grid-template-columns:1fr 1fr;gap:.6rem}.kpi{flex-direction:column;gap:.45rem;padding:.8rem}.kpi strong{font-size:1.05rem}.bolha{width:2.1rem;height:2.1rem}}
.neg{color:var(--despesa)} .pos{color:var(--receita)} .sutil{color:var(--tinta2);font-size:.86rem}
.cab-painel{display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap;margin-bottom:.6rem}
.cab-painel h2{margin:0;display:flex;align-items:center;gap:.5rem}

/* esteira de status */
.esteira{display:flex;height:2.2rem;border-radius:8px;overflow:hidden;margin:.6rem 0 .5rem;background:var(--marca-suave)}
.esteira div{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:.85rem;min-width:0;white-space:nowrap;overflow:hidden;transition:flex-grow .4s}
.e0{background:repeating-linear-gradient(135deg,var(--previsto) 0 8px,color-mix(in srgb,var(--previsto) 80%,#000) 8px 16px)}
.e1{background:var(--fechada);color:#2b1d00!important}.e2{background:var(--conferido)}
.legenda{display:flex;gap:1.2rem;flex-wrap:wrap;font-size:.88rem;align-items:center}
.legenda>span{display:inline-flex;align-items:center;gap:.35rem}
.legenda i{display:inline-block;width:.8rem;height:.8rem;border-radius:3px}

/* tabelas */
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:.45rem .5rem;border-bottom:1px solid var(--linha);vertical-align:middle}
th{color:var(--tinta2);font-weight:500;font-size:.84rem}
td.v,th.v{text-align:right;white-space:nowrap}
tfoot th{border-top:2px solid var(--linha);color:var(--tinta);font-weight:600}
.rolagem{overflow-x:auto}
tr.atual td{background:var(--marca-suave)}
tr.grupo td{background:var(--papel);font-weight:600}
tr.grupo td:first-child{display:flex;align-items:center;gap:.45rem}
tr.sub td:first-child{padding-left:1.7rem}
tr.sub td{font-size:.88rem}
.nomecat{display:inline-flex;align-items:center;gap:.5rem}
table.contas td:first-child{white-space:nowrap}
.abre{background:none;border:0;padding:0;cursor:pointer;font-weight:600;color:var(--tinta);text-align:left;display:inline-flex;align-items:center;gap:.45rem}
.barra{height:.45rem;background:var(--marca-suave);border-radius:4px;position:relative;min-width:70px}
.barra b{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--marca)}
.barra b.estouro{background:var(--despesa)}
.selo{border:0;border-radius:999px;padding:.14rem .6rem .14rem .45rem;font-size:.8rem;font-weight:600;cursor:pointer;color:#fff;white-space:nowrap;display:inline-flex;align-items:center;gap:.3rem}
.selo.c0{background:var(--previsto)}.selo.c1{background:var(--fechada);color:#2b1d00}.selo.c2{background:var(--conferido)}
.tag{display:inline-flex;align-items:center;gap:.25rem;font-size:.75rem;border-radius:999px;padding:.05rem .5rem;background:var(--marca-suave);color:var(--marca);white-space:nowrap}
th.ord button{background:none;border:0;padding:0;cursor:pointer;color:inherit;font:inherit;display:inline-flex;gap:.25rem;align-items:center}
th.ord.v button{margin-left:auto}
th.ord[aria-sort] button{color:var(--tinta);font-weight:600}
input.banco{width:8.5rem;text-align:right;padding:.3rem .45rem}
i.hach{background:repeating-linear-gradient(45deg,var(--despesa) 0 3px,transparent 3px 6px)!important;border:1px solid var(--despesa)}
table.matriz{font-size:.85rem}
table.matriz th,table.matriz td{padding:.35rem .45rem}
table.matriz .fixa{position:sticky;left:0;background:var(--superficie);z-index:1;min-width:12rem;text-align:left}
table.matriz tr.cat th,table.matriz tr.cat td{background:var(--marca-suave);font-weight:600}
table.matriz tr.cat .fixa{background:var(--marca-suave)}

/* formulários */
.filtros{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.75rem}
.filtros>*{flex:1 1 150px}
label{display:block;font-size:.85rem;color:var(--tinta2);margin-bottom:.2rem}
input,select,textarea{width:100%;padding:.5rem .6rem;border:1px solid var(--linha);border-radius:8px;background:var(--papel)}
textarea{min-height:9rem;font-family:ui-monospace,Consolas,monospace;font-size:.85rem}
.form{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.form .largo{grid-column:1/-1}
.btn{border:1px solid var(--marca);background:var(--marca);color:var(--superficie);border-radius:8px;padding:.55rem 1rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:.45rem}
.btn.sec{background:none;color:var(--marca)}
.btn.perigo{background:none;border-color:var(--despesa);color:var(--despesa)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.acoes{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
.escolhas{display:grid;gap:.5rem;margin-top:.8rem}
.escolhas .btn{justify-content:flex-start}
.aviso{border-left:4px solid var(--fechada);background:var(--marca-suave);padding:.7rem .9rem;border-radius:6px;margin:.75rem 0;font-size:.92rem}
.segmentos{display:inline-flex;border:1px solid var(--linha);border-radius:8px;overflow:hidden;background:var(--superficie)}
.segmentos button{background:none;border:0;padding:.35rem .7rem;cursor:pointer;color:var(--tinta2);font-size:.86rem}
.segmentos button+button{border-left:1px solid var(--linha)}
.segmentos button[aria-pressed="true"]{background:var(--marca);color:var(--superficie);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tinta);color:var(--papel);padding:.6rem 1rem;border-radius:8px;z-index:40;max-width:90vw}
@media (max-width:900px){.toast{bottom:calc(5rem + env(safe-area-inset-bottom,0px))}}
dialog{border:1px solid var(--linha);border-radius:14px;background:var(--superficie);color:var(--tinta);width:min(700px,94vw);padding:1.2rem}
dialog::backdrop{background:rgba(0,0,0,.4)}
.tendencia svg{width:100%;height:auto;max-height:230px;display:block}
pre.prompt{white-space:pre-wrap;background:var(--papel);border:1px solid var(--linha);border-radius:8px;padding:.8rem;font-size:.82rem;max-height:26rem;overflow:auto}
.oculto{display:none!important}
@media (prefers-reduced-motion:reduce){.esteira div{transition:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="menu">
    <div class="marca"><span class="selo-casa">🏡</span><span>Orçamento<br>da Família</span></div>
    <nav class="abas" role="tablist">
      <button role="tab" data-aba="painel" data-ic="painel" aria-selected="true"><span class="l">Painel</span><span class="c">Painel</span></button>
      <button role="tab" data-aba="lanc" data-ic="lista"><span class="l">Lançamentos</span><span class="c">Lista</span></button>
      <button role="tab" data-aba="sub" data-ic="grade"><span class="l">Subcategorias</span><span class="c">Análise</span></button>
      <button role="tab" data-aba="novo" data-ic="mais"><span class="l">Novo lançamento</span><span class="c">Novo</span></button>
      <button role="tab" data-aba="ia" data-ic="ia"><span class="l">Prompt da IA</span><span class="c">IA</span></button>
      <button role="tab" data-aba="ajustes" data-ic="ajustes"><span class="l">Ajustes</span><span class="c">Ajustes</span></button>
    </nav>
    <div class="usuario" id="quem"></div>
  </aside>
  <div>
    <header class="barra">
      <h1 id="tituloAba">Painel</h1>
      <div class="mesnav">
        <button class="ico" id="mesAnt" aria-label="Mês anterior">‹</button>
        <span id="mesLbl"></span>
        <button class="ico" id="mesProx" aria-label="Próximo mês">›</button>
      </div>
    </header>
    <main>
      <section id="aba-painel"></section>
      <section id="aba-lanc" class="oculto"></section>
      <section id="aba-sub" class="oculto"></section>
      <section id="aba-novo" class="oculto"></section>
      <section id="aba-ia" class="oculto"></section>
      <section id="aba-ajustes" class="oculto"></section>
    </main>
  </div>
</div>
<dialog id="dlg"><div id="dlgCorpo"></div></dialog>

<script>
"use strict";
/* ========= utilidades ========= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const p2=n=>String(n).padStart(2,"0");
const brl=v=>(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const MESES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const mesLabel=m=>{const[y,mm]=m.split("-");return `${MESES[+mm-1]}/${y}`};
const addMes=(m,n)=>{let[y,mm]=m.split("-").map(Number);mm+=n;y+=Math.floor((mm-1)/12);mm=((mm-1)%12+12)%12+1;return `${y}-${p2(mm)}`};
const hojeISO=()=>{const d=new Date();return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`};
const semAcento=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const limpa=s=>s==null?"":String(s).replace(/\u00a0/g," ").replace(/\s+/g," ").trim();
const novoId=()=>"n"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const STATUS=["Previsto","Fatura fechada","Conferido"];
function toast(msg,ms=3200){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
function diaValido(y,m,d){const ult=new Date(y,m,0).getDate();return Math.min(d,ult)}

/* ========= configuração local (não sensível) ========= */
const CFG_KEY="orcamento.cfg";
function lerCfg(){try{return JSON.parse(localStorage.getItem(CFG_KEY))||{}}catch{return {}}}
function gravarCfg(c){try{localStorage.setItem(CFG_KEY,JSON.stringify(c))}catch{}}
let CFG=Object.assign({modo:"local",clientId:"",linkPasta:""},lerCfg());

/* ========= estado ========= */
const S={base:[],pend:[],tabelas:null,mes:hojeISO().slice(0,7),usuario:"local",pronto:false};
/* Modelo de lançamento (chaves curtas para o arquivo ficar leve):
   id, tp(D despesa|R receita|P previsão/orçado), dc data compra, dp data pagto, m mês pagto (AAAA-MM),
   f forma pagto, v valor, c conf (0|1|2), l local, cat, sub, ds descrição, a autor, o origem, u atualizado(ms), x excluído */
function visao(){
  const mapa=new Map(S.base.map(l=>[l.id,l]));
  [...S.pend].sort((a,b)=>(a.u||0)-(b.u||0)).forEach(p=>{if(p.x)mapa.delete(p.id);else mapa.set(p.id,p)});
  return [...mapa.values()];
}
let CACHE=null; let IDX=null; const invalida=()=>{CACHE=null;IDX=null}; const dados=()=>CACHE||(CACHE=visao());

/* ========= armazenamento: modo local (IndexedDB, para testes) ========= */
const Local={
  _db:null,
  async db(){if(this._db)return this._db;return this._db=await new Promise((ok,err)=>{const r=indexedDB.open("orcamento",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>ok(r.result);r.onerror=()=>err(r.error)})},
  async op(modo,fn){const db=await this.db();return new Promise((ok,err)=>{const tx=db.transaction("kv",modo);const st=tx.objectStore("kv");const r=fn(st);tx.oncomplete=()=>ok(r&&r.result);tx.onerror=()=>err(tx.error)})},
  get(k){return this.op("readonly",s=>s.get(k))}, put(k,v){return this.op("readwrite",s=>s.put(v,k))},
  async init(){},
  async carregar(){S.base=await this.get("base")||[];S.pend=await this.get("pend")||[];S.tabelas=await this.get("tabelas")||null},
  async salvarPend(obj){S.pend.push(obj);await this.put("pend",S.pend)},
  async gravarBase(base){await this.put("base",base);await this.put("pend",[]);S.base=base;S.pend=[]},
  async gravarTabelas(t){await this.put("tabelas",t);S.tabelas=t},
  async consolidar(){const v=visao();await this.gravarBase(v);return S.pend.length},
  async enviarExport(){return false}
};

/* ========= armazenamento: OneDrive pessoal (Microsoft Graph) ========= */
const G="https://graph.microsoft.com/v1.0";
const ESCOPOS=["User.Read","Files.ReadWrite.All"];
let MSAL=null;
const OneDrive={
  D:null,F:null,eTagBase:null,
  async login(){
    if(!window.msal)throw new Error("Biblioteca de login da Microsoft não carregou. Verifique a internet.");
    if(!CFG.clientId)throw new Error("Informe o ID do aplicativo em Ajustes.");
    MSAL=MSAL||new msal.PublicClientApplication({auth:{clientId:CFG.clientId,authority:"https://login.microsoftonline.com/consumers",redirectUri:location.origin+location.pathname},cache:{cacheLocation:"localStorage"}});
    const r=await MSAL.handleRedirectPromise();
    const conta=(r&&r.account)||MSAL.getAllAccounts()[0];
    if(!conta){await MSAL.loginRedirect({scopes:ESCOPOS});return null}
    MSAL.setActiveAccount(conta);S.usuario=conta.username||conta.name||"usuário";return conta;
  },
  async sair(){if(MSAL)await MSAL.logoutRedirect({account:MSAL.getActiveAccount()})},
  async token(){const conta=MSAL.getActiveAccount();try{return (await MSAL.acquireTokenSilent({scopes:ESCOPOS,account:conta})).accessToken}catch(e){await MSAL.acquireTokenRedirect({scopes:ESCOPOS,account:conta});throw e}},
  async gx(metodo,url,corpo,cab={}){
    const t=await this.token();
    const r=await fetch(url.startsWith("http")?url:G+url,{method:metodo,headers:{Authorization:"Bearer "+t,...cab},body:corpo});

/* ========= importação do Excel histórico ========= */
function serialISO(v){
  if(v==null||v==="")return null;
  if(typeof v==="number"){const d=XLSX.SSF.parse_date_code(v);return d?`${d.y}-${p2(d.m)}-${p2(d.d)}`:null}
  const s=String(v).trim();let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return `${m[3]}-${p2(m[2])}-${p2(m[1])}`;
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[1]}-${m[2]}-${m[3]}`:null;
}
const corrigeCat=c=>limpa(c).replace(/_/g," ");
function lerAba(wb,nome,tp,cod){
  const ws=wb.Sheets[nome];if(!ws)return [];
  const linhas=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
  const out=[];
  for(let i=1;i<linhas.length;i++){const r=linhas[i];if(!r||r[4]==null||r[4]===""||isNaN(+r[4]))continue;
    const dc=serialISO(r[0]),dp=serialISO(r[1])||dc,mp=serialISO(r[2])||dp;if(!mp)continue;
    out.push({id:`h${cod}${i+1}`,tp,dc:dc||dp,dp,m:mp.slice(0,7),f:limpa(r[3]),v:Math.round(+r[4]*100)/100,c:[0,1,2].includes(+r[5])?+r[5]:0,
      l:limpa(r[6]),cat:corrigeCat(r[7]),sub:limpa(r[8]),ds:limpa(r[9]),a:"histórico",o:"excel",u:0});
  }
  return out;
}
function montarTabelas(wb,lanc){
  const catD={},catR=new Set(),formas=new Set();
  const addD=(c,s)=>{if(!c)return;(catD[c]=catD[c]||new Set());if(s)catD[c].add(s)};
  const ws=wb.Sheets["Tabelas"];
  if(ws){const L=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
    let r0=-1,c0=-1;L.forEach((r,i)=>r&&r.forEach((v,j)=>{if(limpa(v)==="CatDespesas"){r0=i;c0=j}}));
    if(r0>=0){for(let i=r0+1;i<L.length;i++){const r=L[i]||[];if(r[c0]==null&&r[c0+1]==null&&r[c0+2]==null)break;
      if(r[c0])addD(corrigeCat(r[c0]));if(r[c0+1])catR.add(limpa(r[c0+1]));if(r[c0+2])formas.add(limpa(r[c0+2]))}}
    const nomes=Object.keys(catD);
    L.forEach((r,i)=>{if(!r)return;const cols=r.map((v,j)=>nomes.includes(corrigeCat(v))?j:-1).filter(j=>j>=0);
      if(cols.length>=5)cols.forEach(j=>{const c=corrigeCat(r[j]);for(let k=i+1;k<L.length&&L[k]&&L[k][j]!=null;k++)addD(c,limpa(L[k][j]))})});
  }
  lanc.forEach(l=>{if(l.tp==="R")catR.add(l.cat);else addD(l.cat,l.sub);if(l.f)formas.add(l.f)});
  const out={catD:{},catR:[...catR].filter(Boolean).sort(),formas:[...formas].filter(f=>f&&f!=="Previsão").sort(),cartoes:(S.tabelas&&S.tabelas.cartoes)||{}};
  Object.keys(catD).sort().forEach(c=>out.catD[c]=[...catD[c]].sort());
  return out;
}
/* ========= leitura de contas e saldos da aba Resumo ========= */
function lerContasResumo(wb){
  const ws=wb.Sheets["Resumo"];if(!ws||!ws["!ref"])return null;
  const R=XLSX.utils.decode_range(ws["!ref"]);const cel=(r,c)=>ws[XLSX.utils.encode_cell({r,c})];
  const lab=r=>{const c=cel(r,1);return c?limpa(c.v):""};
  const alvo=hojeISO().slice(0,7);let col=-1,mesCol=null;
  for(let c=2;c<=R.e.c;c++){const ce=cel(0,c);if(!ce||typeof ce.v!=="number")continue;const iso=serialISO(ce.v);if(iso&&iso.slice(0,7)<=alvo){col=c;mesCol=iso.slice(0,7)}}
  if(col<0)return null;
  let rRec=-1,rDes=-1,rFin=-1;for(let r=0;r<=R.e.r;r++){const l=lab(r);if(l==="Receitas"&&rRec<0)rRec=r;if(l==="Despesas"&&rDes<0)rDes=r;if(l==="Saldo Final"){rFin=r;break}}
  if(rFin<0||rRec<0)return null;
  const contas={},debito={},debR={};
  for(let r=rFin+1;r<=R.e.r;r++){
    const nome=lab(r);if(!nome)break;const ce=cel(r,col);if(!ce)continue;
    let ini=0;
    if(ce.f){for(const m of ce.f.matchAll(/\$?([A-Z]{1,3})\$?(\d+)/g)){const rr=+m[2]-1;if(rr>=rFin)continue;
        if(rr<rRec){const c2=cel(rr,col);ini=+(c2&&c2.v)||0}else{const f=lab(rr);if(!f)continue;if(rDes>=0&&rr>rDes)debito[f]=nome;else if(!debR[f])debR[f]=nome}}}
    else continue;
    contas[nome]={ini:Math.round(ini*100)/100,mes:mesCol};
  }
  for(const[f,c]of Object.entries(debR))if(!debito[f])debito[f]=c; // despesas definem o vínculo; receitas só completam
  // blocos de aplicações e empréstimos a receber, abaixo do Saldo Final
  let grupo=null,blocos=0,vazio=0;
  for(let r=rFin+1;r<=R.e.r;r++){
    const ce0=cel(r,1);const nome=ce0&&typeof ce0.v==="string"?limpa(ce0.v):"";
    if(!nome){if(grupo)vazio++;continue}
    if(/^aplica[cç][oõ]es$/i.test(nome)){blocos++;grupo=blocos===1?"Aplicações":"Reservas e metas";continue}
    if(!grupo)continue;
    const ce=cel(r,col);const v=ce&&typeof ce.v==="number"?Math.round(ce.v*100)/100:0;if(!v)continue;
    const nm=nome.replace(/^conta\s+/i,"");
    if(/receber/i.test(nome))contas[nm]={ini:v,mes:mesCol,tipo:"receber",grupo:"A receber"};
    else if(!contas[nm])contas[nm]={ini:v,mes:mesCol,tipo:"investimento",grupo};
  }
  return Object.keys(contas).length?{contas,debito}:null;
}
async function importarExcel(arq){
  const wb=XLSX.read(await arq.arrayBuffer(),{type:"array"});
  const lanc=[...lerAba(wb,"Despesas","D","d"),...lerAba(wb,"Receitas","R","r"),...lerAba(wb,"Previsões","P","p")];
  if(!lanc.length)throw new Error("Não encontrei as abas Despesas, Receitas ou Previsões no arquivo.");
  const tabelas=montarTabelas(wb,lanc);const rs=lerContasResumo(wb);
  if(rs){tabelas.contas=rs.contas;tabelas.debito=rs.debito}
  tabelas.banco=(S.tabelas&&S.tabelas.banco)||{};
  return {lanc,tabelas};
}

function serial(iso){if(!iso)return null;const[y,m,d]=iso.split("-").map(Number);return (Date.UTC(y,m-1,d||1)-Date.UTC(1899,11,30))/864e5}
function gerarXlsx(){
  const wb=XLSX.utils.book_new();const L=dados();
  const cab=["Dt Compra","Dt Pagto","MêsPagto","Forma de Pagamento","Vlr Pagto","Conf","Local","Categoria","Sub-tipo","Descrição","Lançado por","Origem","ID"];
  for(const[tp,nome]of[["D","Despesas"],["R","Receitas"],["P","Previsões"]]){
    const rows=L.filter(l=>l.tp===tp).sort((a,b)=>(a.m+a.dp).localeCompare(b.m+b.dp));
    const aoa=[cab,...rows.map(l=>[serial(l.dc),serial(l.dp),serial(l.m+"-01"),l.f,l.v,l.c,l.l,l.cat,l.sub,l.ds,l.a,l.o,l.id])];
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    for(let i=1;i<aoa.length;i++){["A","B"].forEach(c=>{const ce=ws[c+(i+1)];if(ce)ce.z="dd/mm/yyyy"});const m=ws["C"+(i+1)];if(m)m.z="mmm/yy";const v=ws["E"+(i+1)];if(v)v.z="#,##0.00"}
    ws["!cols"]=[10,10,8,26,11,5,30,20,26,30,22,8,14].map(w=>({wch:w}));
    ws["!autofilter"]={ref:`A1:M${aoa.length}`};
    XLSX.utils.book_append_sheet(wb,ws,nome);
  }
  const trs=L.filter(l=>l.tp==="T").sort((a,b)=>(a.m+a.dp).localeCompare(b.m+b.dp));
  const cabT=["Data","MêsPagto","Conta de origem","Conta de destino","Valor","Conf","Local","Categoria","Sub-tipo","Descrição","Lançado por","Origem","ID"];
  const aoaT=[cabT,...trs.map(l=>[serial(l.dp||l.dc),serial(l.m+"-01"),l.f||"",l.fd||"",l.v,l.c,l.l,l.cat,l.sub,l.ds,l.a,l.o,l.id])];
  const wsT=XLSX.utils.aoa_to_sheet(aoaT);for(let i=1;i<aoaT.length;i++){const a=wsT["A"+(i+1)];if(a)a.z="dd/mm/yyyy";const m=wsT["B"+(i+1)];if(m)m.z="mmm/yy";const v=wsT["E"+(i+1)];if(v)v.z="#,##0.00"}
  wsT["!cols"]=[10,8,24,24,11,5,30,16,24,30,22,8,14].map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,wsT,"Transferências");
  return new Blob([XLSX.write(wb,{bookType:"xlsx",type:"array"})],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}

const ehCartao=f=>/cart[aã]o/i.test(f||"");
function calcularPagto(forma,dc){
  if(!dc)dc=hojeISO();const[y,m,d]=dc.split("-").map(Number);const mc=`${y}-${p2(m)}`;
  if(!ehCartao(forma))return {m:mc,dp:dc};
  const cc=(S.tabelas&&S.tabelas.cartoes&&S.tabelas.cartoes[forma])||{};
  const F=+cc.fech,V=+cc.venc;
  if(F&&V){const fechaMes=d<F?mc:addMes(mc,1);const venceMes=V>F?fechaMes:addMes(fechaMes,1);
    const[yy,mm]=venceMes.split("-").map(Number);return {m:venceMes,dp:`${venceMes}-${p2(diaValido(yy,mm,V))}`}}
  const vm=addMes(mc,1);return {m:vm,dp:`${vm}-10`};
}
const confPadrao=f=>/dinheiro/i.test(f||"")?2:0;
function gerarParcelas(base,n){
  n=Math.max(1,Math.min(48,+n||1));const total=Math.round(base.v*100);const parc=Math.floor(total/n);const out=[];const g=n>1?"g"+novoId().slice(1):undefined;
  const {m,dp}=calcularPagto(base.f,base.dc);
  for(let i=0;i<n;i++){const v=(i===n-1?total-parc*(n-1):parc)/100;
    const mi=addMes(m,i);const[yy,mm]=mi.split("-").map(Number);
    out.push({...base,id:novoId(),g,pi:n>1?i+1:undefined,pn:n>1?n:undefined,v,m:mi,dp:`${mi}-${p2(diaValido(yy,mm,+dp.slice(8,10)))}`,l:n>1?`${base.l} ${p2(i+1)}/${p2(n)}`:base.l,c:i===0?base.c:0});}
  return out;
}

  calendario:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'
};
const ic=(n,extra="")=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" ${extra}>${IC[n]||IC.etiqueta}</svg>`;
function icCat(c){const s=semAcento(c);
  if(/aliment|mercado|comida/.test(s))return "carrinho";if(/transport|carro|veicul/.test(s))return "carro";if(/domest|casa|moradia/.test(s))return "casa";
  if(/pesso/.test(s))return "pessoa";if(/educa|escola/.test(s))return "livro";if(/saude|farmac/.test(s))return "coracao";if(/lazer|viag/.test(s))return "lazer";
  if(/esporad/.test(s))return "raio";if(/banco/.test(s))return "conta";if(/rendiment|aplica/.test(s))return "invest";if(/salari|ppr|13|ferias/.test(s))return "dinheiro";return "etiqueta"}
const ST_IC=["relogio","cadeado","check"];

/* ========= contas: tipos e vínculos ========= */
const TIPOS={corrente:"Conta corrente",dinheiro:"Dinheiro",previsao:"Previsão",investimento:"Aplicação",receber:"A receber",divida:"Dívida"};
const TIPO_IC={corrente:"conta",dinheiro:"dinheiro",previsao:"relogio",investimento:"invest",receber:"receber",divida:"divida"};
const liquida=t=>t==="corrente"||t==="dinheiro"||t==="previsao";
function tipoConta(c){const cfg=((S.tabelas||{}).contas||{})[c];if(cfg&&cfg.tipo)return cfg.tipo;if(/dinheiro/i.test(c))return "dinheiro";if(/previs/i.test(c))return "previsao";return "corrente"}
function grupoConta(c){const t=tipoConta(c);if(liquida(t))return "Contas correntes";if(t==="receber")return "A receber";if(t==="divida")return "Dívidas";return (((S.tabelas||{}).contas||{})[c]||{}).grupo||"Aplicações"}
const ORDEM_GRUPO=g=>g==="Contas correntes"?0:g==="Dívidas"?9:g==="A receber"?8:1;
function pessoaBanco(f){const m=String(f||"").match(/^(.+?)\s*-\s*(Cart[aã]o|Conta)\s+(\S+)/i);return m?{p:semAcento(m[1]),b:semAcento(m[3])}:null}
function contaDe(f){
  if(!f)return "";const T=S.tabelas||{};const deb=T.debito||{};if(deb[f])return deb[f];
  const contas=Object.keys(T.contas||{});if(contas.includes(f))return f;
  const pb=pessoaBanco(f);if(!pb)return "";
  return contas.find(c=>{const q=pessoaBanco(c);return q&&q.p===pb.p&&q.b===pb.b&&/conta/i.test(c)})||"";
}
const slug=s=>semAcento(s).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

/* ========= índices (somas pré-calculadas) ========= */
function idx(){
  if(IDX)return IDX;const L=dados();const D={},P={},R={},Dm={},Rm={},Gm={},mov={},semConta={};
  const mexe=(c,m,val,conf)=>{const o=((mov[c]=mov[c]||{})[m]=mov[c][m]||{all:0,c2:0,ent:0,sai:0});o.all+=val;if(conf===2)o.c2+=val;if(val>=0)o.ent+=val;else o.sai-=val};
  for(const l of L){
    if(l.tp==="P"){if(l.pt)continue;const k=l.m+"|"+l.cat+"|"+l.sub;P[k]=(P[k]||0)+l.v;continue}
    if(l.tp==="T"){
      const o=contaDe(l.f),d=contaDe(l.fd);
      if(l.f&&!o)semConta[l.f]=(semConta[l.f]||0)+1;if(l.fd&&!d)semConta[l.fd]=(semConta[l.fd]||0)+1;
      if(o)mexe(o,l.m,-l.v,l.c);if(d)mexe(d,l.m,l.v,l.c);
      if(o&&d){const lo=liquida(tipoConta(o)),ld=liquida(tipoConta(d));if(lo&&!ld)Gm[l.m]=(Gm[l.m]||0)+l.v;else if(!lo&&ld)Gm[l.m]=(Gm[l.m]||0)-l.v}
      continue;
    }
    if(l.tp==="D"){const k=l.m+"|"+l.cat+"|"+l.sub;D[k]=(D[k]||0)+l.v;Dm[l.m]=(Dm[l.m]||0)+l.v}
    else if(l.tp==="R"){const k=l.m+"|"+l.cat;R[k]=(R[k]||0)+l.v;Rm[l.m]=(Rm[l.m]||0)+l.v}
    const c=contaDe(l.f);if(!c){semConta[l.f]=(semConta[l.f]||0)+1;continue}
    mexe(c,l.m,l.tp==="R"?l.v:-l.v,l.c);
  }
  const aL={},aLk={};
  for(const[k,v]of Object.entries(P)){const falta=Math.max(0,v-(D[k]||0));if(!falta)continue;const m=k.slice(0,7);aL[m]=(aL[m]||0)+falta;aLk[k]=falta}
  return IDX={D,P,R,Dm,Rm,Gm,mov,semConta,aL,aLk,memo:{}};
}
function saldosMes(m){
  const I=idx();if(I.memo[m])return I.memo[m];const T=S.tabelas||{};const {mov}=I;
  return I.memo[m]=Object.entries(T.contas||{}).map(([c,cfg])=>{
    const tipo=tipoConta(c),grupo=grupoConta(c);
    if(!cfg.mes||m<cfg.mes)return {c,tipo,grupo,sem:true};
    let ini=+cfg.ini||0;for(let k=cfg.mes;k<m;k=addMes(k,1))ini+=((mov[c]||{})[k]||{}).all||0;
    const o=(mov[c]||{})[m]||{all:0,c2:0,ent:0,sai:0};
    const banco=((T.banco||{})[c]||{})[m];
    return {c,tipo,grupo,ini,ent:o.ent,sai:o.sai,real:ini+o.c2,prev:ini+o.all,banco};
  });
}
function resumoSaldos(m){
  const ok=saldosMes(m).filter(s=>!s.sem);const soma=(f,k)=>ok.filter(f).reduce((a,s)=>a+(s[k]||0),0);
  const liq=s=>liquida(s.tipo);
  return {temContas:ok.length>0,liqIni:soma(liq,"ini"),liqReal:soma(liq,"real"),liqPrev:soma(liq,"prev"),patIni:soma(()=>1,"ini"),patPrev:soma(()=>1,"prev"),ok};
}
const idAjuste=(c,m)=>`aj-${slug(c)}-${m}`;
async function informarSaldo(c,M,valor){
  const t=JSON.parse(JSON.stringify(S.tabelas));t.banco=t.banco||{};t.banco[c]=t.banco[c]||{};
  if(valor===""||valor==null||isNaN(valor)){delete t.banco[c][M];await B().gravarTabelas(t);invalida();return renderPainel()}
  valor=Math.round(valor*100)/100;t.banco[c][M]=valor;
  const tipo=tipoConta(c);
  if(tipo==="investimento"||tipo==="divida"){
    const s=saldosMes(M).find(x=>x.c===c);const id=idAjuste(c,M);const atual=dados().find(l=>l.id===id);
    const contrib=atual?(atual.tp==="R"?atual.v:-atual.v):0;const prevSem=s.prev-contrib;
    const alvo=tipo==="divida"?-Math.abs(valor):valor;const aj=Math.round((alvo-prevSem)*100)/100;
    const [y,mm]=M.split("-").map(Number);const dia=`${M}-${p2(new Date(y,mm,0).getDate())}`;
    if(Math.abs(aj)<0.005){if(atual)await salvar([{id,x:1}])}
    else{
      const txt=tipo==="divida"?`Lançar juros de ${brl(-aj)} na dívida “${c}”?`:`Lançar ${aj>=0?"rendimento":"perda"} de ${brl(aj)} na aplicação “${c}”?`;
      if(!confirm(txt+"\n\nO valor é a diferença entre o saldo informado e o saldo calculado pela plataforma."))return renderPainel();
      if(tipo==="investimento"){
        if(!t.catR.includes("Rendimentos"))t.catR=[...t.catR,"Rendimentos"].sort();
        await salvar([{id,tp:"R",dc:dia,dp:dia,m:M,f:c,v:aj,c:2,l:`Rendimento ${c}`,cat:"Rendimentos",sub:"",ds:"Calculado pelo saldo informado",o:"auto"}]);
      }else{
        t.catD.Bancos=t.catD.Bancos||[];if(!t.catD.Bancos.includes("Juros de empréstimos"))t.catD.Bancos=[...t.catD.Bancos,"Juros de empréstimos"].sort();
        await salvar([{id,tp:"D",dc:dia,dp:dia,m:M,f:c,v:-aj,c:2,l:`Juros ${c}`,cat:"Bancos",sub:"Juros de empréstimos",ds:"Calculado pelo saldo devedor informado",o:"auto"}]);
      }
    }
  }
  await B().gravarTabelas(t);invalida();renderPainel();
}

/* ========= painel ========= */
function somar(L,f){return L.reduce((s,l)=>f(l)?s+l.v:s,0)}
function difHtml(d){if(Math.abs(d)<0.005)return `<span class="pos">${ic("check")} bate</span>`;return `<span class="neg">${d>0?"+":""}${brl(d)}</span>`}
const ABERTAS=new Set();

function renderPainel(){

    ${RS.temContas?kpi("patrimonio","v","Patrimônio líquido",brl(RS.patPrev),RS.patPrev<0?"neg":"",`${RS.patPrev-RS.patIni>=0?"+":""}${brl(RS.patPrev-RS.patIni)} no mês`):""}

  else{

      else if(s.banco!=null&&s.banco!==""&&s.tipo!=="investimento"&&s.tipo!=="divida")dif=difHtml(+s.banco-s.real);

    const tot=(arr,k)=>arr.filter(s=>!s.sem).reduce((a,s)=>a+(s[k]||0),0);
    cardContas=`<div class="painel rolagem"><div class="cab-painel"><h2>${ic("conta")} Saldos das contas em ${mesLabel(M)}</h2></div>
      <p class="sutil">Realizado = só conferidos. Previsto = inclui previstos e faturas fechadas. Em aplicações, o saldo informado gera o rendimento do mês; em dívidas, o saldo devedor informado gera os juros.</p>
      <table class="contas"><thead><tr><th>Conta</th><th class="v">Saldo inicial</th><th class="v">Entradas</th><th class="v">Saídas</th><th class="v">Realizado</th><th class="v">Previsto fim do mês</th><th class="v">Informado</th><th class="v">Conferência</th></tr></thead>

      <tfoot><tr><th>Patrimônio líquido</th><th class="v">${brl(RS.patIni)}</th><th></th><th></th><th class="v">${brl(tot(sal,"real"))}</th><th class="v">${brl(RS.patPrev)}</th><th></th><th></th></tr></tfoot></table>
      ${Object.keys(I.semConta).length?`<div class="aviso">Formas de pagamento sem conta vinculada ficam fora dos saldos: ${Object.keys(I.semConta).map(esc).join(", ")}. Vincule em Ajustes.</div>`:""}

    try{await informarSaldo(i.dataset.banco,M,i.value===""?"":parseFloat(i.value))}catch(x){toast(x.message);i.disabled=false}});

function lerForm(raiz,l){
  raiz.querySelectorAll("[data-k]").forEach(i=>{const k=i.dataset.k;let v=i.value;if(k==="v")v=Math.round(parseFloat(String(v).replace(",","."))*100)/100;if(k==="c")v=+v;l[k]=v});

}
function ligarForm(raiz,l,rerender){

  if(l.tp==="T")return;
  q("cat").onchange=()=>{lerForm(raiz,l);l.sub="";rerender()};
  const recalc=()=>{lerForm(raiz,l);const p=calcularPagto(l.f,l.dc);q("m").value=p.m;q("dp").value=p.dp;if(raiz.dataset.novo)q("c").value=String(confPadrao(l.f))};
  q("f").onchange=recalc;q("dc").onchange=recalc;
}
function validar(l){
  if(!l.dc)return "Informe a data.";if(!isFinite(l.v)||l.v===0)return "Informe um valor diferente de zero.";

  if(!l.f)return "Escolha a forma de pagamento.";if(!l.cat)return "Escolha a categoria.";if(!l.m)return "Informe o mês de pagamento.";return null;
}

/* ========= reclassificação: despesas/receitas que são transferências ========= */
const PADRAO_TR=/aplica|transfer|cota|emprest/;
function sugerirDestino(tp,cat,sub){
  const T=S.tabelas||{};const contas=Object.keys(T.contas||{});const s=semAcento(sub||cat);
  const resto=s.replace(/^(aplicac\w*|aplica\w*|emprestim\w*|transferenc\w*|cotas?)\s*(de\s+)?/,"").trim();
  const acha=t=>contas.find(c=>semAcento(c).includes(t));
  if(/transfer/.test(s))return {d:""};
  if(/^aplica/.test(s)){if(!resto)return {d:""};const c=acha(resto);return c?{d:c}:{d:"",novo:{nome:"Aplicação "+(sub||cat).replace(/^\S+\s*/,""),tipo:"investimento"}}}
  if(/cota/.test(s)){const c=acha("cota");return c?{d:c}:{d:"",novo:{nome:"Cotas de capital",tipo:"investimento"}}}
  if(/emprest/.test(s)){
    if(resto){const c=acha(resto)||contas.find(c=>tipoConta(c)==="receber");return c?{d:c}:{d:"",novo:{nome:"Empréstimo a receber - "+(sub||cat).replace(/^\S+\s*/,""),tipo:"receber"}}}
    const c=contas.find(c=>tipoConta(c)==="divida");return c?{d:c}:{d:"",novo:{nome:"Empréstimos bancários",tipo:"divida"}};
  }
  return {d:""};
}
function detectarRegras(){
  const g={};
  for(const l of dados()){
    if(l.tp!=="D"&&l.tp!=="R")continue;
    const alvo=semAcento(l.tp==="D"?l.sub:l.cat);if(!PADRAO_TR.test(alvo))continue;
    const k=`${l.tp}|${l.cat}|${l.tp==="D"?l.sub:""}`;(g[k]=g[k]||{tp:l.tp,cat:l.cat,sub:l.tp==="D"?l.sub:"",n:0,t:0}).n++;g[k].t+=l.v;
  }
  return Object.values(g).sort((a,b)=>b.t-a.t).map(r=>({...r,...sugerirDestino(r.tp,r.cat,r.sub)}));
}

      for(const r of ativas)if(r.usarNovo&&r.novo&&!r.d){if(!t.contas[r.novo.nome])t.contas[r.novo.nome]={ini:0,mes:mesAnc,tipo:r.novo.tipo,grupo:r.novo.tipo==="investimento"?"Aplicações":undefined};r.d=r.novo.nome}

        const sai=(l.tp==="D")===(l.v>=0); // despesa positiva ou receita negativa: dinheiro sai da conta
        return {...l,tp:"T",v,f:sai?conta:dest,fd:sai?dest:conta,o2:"reclass",u:Date.now()};

  };

    <p class="sutil">Lê só a aba Resumo (contas, aplicações e empréstimos a receber). Os lançamentos não são alterados; contas já cadastradas mantêm tipo e grupo.</p>
    <div class="rolagem"><table><thead><tr><th>Conta</th><th>Tipo</th><th>Grupo</th><th>Saldo inicial</th><th>No início de</th><th></th></tr></thead><tbody>
    ${contas.map(([c,v])=>{const tp=tipoConta(c);return `<tr><td><span class="nomecat">${ic(TIPO_IC[tp])}${esc(c)}</span></td>
      <td><select data-ctipo="${esc(c)}">${Object.entries(TIPOS).map(([k,t])=>`<option value="${k}" ${k===tp?"selected":""}>${t}</option>`).join("")}</select></td>
      <td><input data-cgrupo="${esc(c)}" value="${esc(v.grupo||"")}" placeholder="${tp==="investimento"?"Aplicações":"—"}" ${tp==="investimento"?"":"disabled"}></td>
      <td><input type="number" step="0.01" data-cini="${esc(c)}" value="${tp==="divida"?Math.abs(v.ini||0):(v.ini??0)}" style="min-width:7rem"></td>
      <td><input type="month" data-cmes="${esc(c)}" value="${esc(v.mes||"")}"></td><td><button class="ico" data-cdel="${esc(c)}" aria-label="Remover conta">${ic("lixo")}</button></td></tr>`}).join("")||`<tr><td colspan="6" class="sutil">Nenhuma conta ainda.</td></tr>`}
    </tbody></table></div>
    <div class="form" style="margin-top:.6rem"><div><label>Nome da nova conta</label><input id="novaConta" list="sugContas" placeholder="Ex.: Elvis - XP Investimentos"><datalist id="sugContas">${(T.formas||[]).filter(f=>!ehCartao(f)&&!(T.contas||{})[f]).map(f=>`<option value="${esc(f)}">`).join("")}</datalist></div>
      <div><label>Tipo</label><select id="novaTipo">${Object.entries(TIPOS).map(([k,t])=>`<option value="${k}">${t}</option>`).join("")}</select></div>
      <div style="align-self:end"><button class="btn sec" id="ajAddConta">Adicionar conta</button></div></div>
    <h3 style="margin-top:1.2rem">Em qual conta cada forma de pagamento cai</h3>
    <div class="rolagem"><table><thead><tr><th>Forma de pagamento</th><th>Debita / credita na conta</th></tr></thead><tbody>
    ${[...(T.formas||[]),"Previsão"].map(f=>`<tr><td>${esc(f)}</td><td><select data-deb="${esc(f)}">${opts(contas.map(x=>x[0]),contaDe(f),"— fora dos saldos —")}</select></td></tr>`).join("")}
    </tbody></table></div>
    <div class="acoes"><button class="btn" id="ajSalvarContas">Salvar contas</button></div>
  </div>
  <div class="painel"><h2>${ic("cartao")} Fechamento e vencimento dos cartões</h2>
    <p class="sutil">Com estes dias, a plataforma calcula em qual fatura cada compra cai. Sem eles, assume a fatura do mês seguinte, com vencimento no dia 10.</p>
    <div class="rolagem"><table><thead><tr><th>Cartão</th><th>Dia de fechamento</th><th>Dia de vencimento</th></tr></thead><tbody>
    ${cartoes.map(c=>{const v=(T.cartoes||{})[c]||{};return `<tr><td>${esc(c)}</td><td><input type="number" min="1" max="31" data-cart="${esc(c)}" data-campo="fech" value="${v.fech||""}"></td><td><input type="number" min="1" max="31" data-cart="${esc(c)}" data-campo="venc" value="${v.venc||""}"></td></tr>`}).join("")||`<tr><td colspan="3" class="sutil">Importe o histórico para listar os cartões.</td></tr>`}
    </tbody></table></div>
    <div class="acoes"><button class="btn" id="ajCartoes">Salvar dias dos cartões</button></div>
  </div></div></div>`;
  renderReclass();
  const clone=()=>JSON.parse(JSON.stringify(S.tabelas));
  const salvarT=async(t,msg)=>{try{await B().gravarTabelas(t);invalida();renderAjustes();toast(msg)}catch(x){toast(x.message)}};
  $("#ajModo").onchange=e=>{$("#ajOD").classList.toggle("oculto",e.target.value!=="onedrive")};
  $("#ajSalvarCfg").onclick=async()=>{CFG.modo=$("#ajModo").value;CFG.clientId=$("#ajClient").value.trim();CFG.linkPasta=$("#ajLink").value.trim();gravarCfg(CFG);MSAL=null;await iniciar()};
  if($("#ajSair"))$("#ajSair").onclick=()=>OneDrive.sair();
  $("#ajArq").onchange=async e=>{const a=e.target.files[0];if(!a)return;
    if((S.base.length||S.pend.length)&&!confirm("Substituir a base inteira pelo conteúdo desta planilha? Tudo o que foi lançado na plataforma será apagado.")){e.target.value="";return}
    try{toast("Lendo a planilha…");const {lanc,tabelas}=await importarExcel(a);await B().gravarTabelas(tabelas);await B().gravarBase(lanc);
      if(CFG.modo==="onedrive")for(const p of [...S.pend])if(p._arq)await OneDrive.gx("DELETE",`/drives/${OneDrive.D}/items/${p._arq}`);
      S.pend=[];invalida();renderTudo();toast(`${lanc.length} lançamentos importados.`)}catch(x){toast(x.message,6000)}};
  $("#ajExport").onclick=async e=>{e.target.disabled=true;try{const blob=gerarXlsx();const nome=`Orcamento_Consolidado_${hojeISO()}.xlsx`;
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nome;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    if(await B().enviarExport(blob,nome))toast("Excel gerado e salvo no OneDrive.");else toast("Excel gerado.")}catch(x){toast(x.message)}e.target.disabled=false};
  if($("#ajConsol"))$("#ajConsol").onclick=async e=>{e.target.disabled=true;try{const n=await B().consolidar();invalida();renderTudo();toast(`${n} pendentes consolidados.`)}catch(x){toast(x.message,6000);e.target.disabled=false}};
  $("#ajResumo").onchange=async e=>{const a=e.target.files[0];if(!a)return;
    try{const wb=XLSX.read(await a.arrayBuffer(),{type:"array"});const rs=lerContasResumo(wb);if(!rs)return toast("Não encontrei a seção Saldo Final na aba Resumo.");
      const t=clone();const antigas=t.contas||{};t.contas={};
      for(const[c,v]of Object.entries(rs.contas)){const a0=antigas[c]||{};t.contas[c]={...v,tipo:a0.tipo||v.tipo,grupo:a0.grupo||v.grupo}}
      for(const[c,v]of Object.entries(antigas))if(!t.contas[c])t.contas[c]=v;
      t.debito={...(t.debito||{}),...rs.debito};
      await salvarT(t,`${Object.keys(rs.contas).length} contas lidas, saldos de ${mesLabel(Object.values(rs.contas)[0].mes)}.`)}catch(x){toast(x.message)}};
  document.querySelectorAll("[data-ctipo]").forEach(s=>s.onchange=()=>{const g=document.querySelector(`[data-cgrupo="${CSS.escape(s.dataset.ctipo)}"]`);if(g)g.disabled=s.value!=="investimento"});
  document.querySelectorAll("[data-cdel]").forEach(b=>b.onclick=()=>{if(!confirm("Remover esta conta dos saldos?"))return;const t=clone();delete t.contas[b.dataset.cdel];salvarT(t,"Conta removida.")});
  $("#ajAddConta").onclick=()=>{const c=limpa($("#novaConta").value);if(!c)return toast("Informe o nome da conta.");const t=clone();t.contas=t.contas||{};
    if(t.contas[c])return toast("Essa conta já existe.");t.contas[c]={ini:0,mes:S.mes,tipo:$("#novaTipo").value};salvarT(t,"Conta adicionada. Ajuste o saldo inicial e salve.")};
  $("#ajSalvarContas").onclick=()=>{const t=clone();t.contas=t.contas||{};t.debito={};
    document.querySelectorAll("[data-ctipo]").forEach(s=>{t.contas[s.dataset.ctipo].tipo=s.value});
    document.querySelectorAll("[data-cgrupo]").forEach(i=>{const c=i.dataset.cgrupo;if(t.contas[c].tipo==="investimento"&&limpa(i.value))t.contas[c].grupo=limpa(i.value);else delete t.contas[c].grupo});
    document.querySelectorAll("[data-cini]").forEach(i=>{const c=i.dataset.cini;const v=Math.round((parseFloat(i.value)||0)*100)/100;t.contas[c].ini=t.contas[c].tipo==="divida"?-Math.abs(v):v});
    document.querySelectorAll("[data-cmes]").forEach(i=>{t.contas[i.dataset.cmes].mes=i.value});
    document.querySelectorAll("[data-deb]").forEach(s=>{if(s.value)t.debito[s.dataset.deb]=s.value});
    salvarT(t,"Contas salvas.")};
  $("#ajCartoes").onclick=async()=>{const t=clone();t.cartoes=t.cartoes||{};
    document.querySelectorAll("[data-cart]").forEach(i=>{const c=i.dataset.cart;t.cartoes[c]=t.cartoes[c]||{};t.cartoes[c][i.dataset.campo]=+i.value||null});
    try{await B().gravarTabelas(t);invalida();toast("Dias dos cartões salvos.")}catch(x){toast(x.message)}};
}

/* ========= navegação e inicialização ========= */
let ABA="painel";
const TITULOS={painel:"Painel",lanc:"Lançamentos",sub:"Subcategorias",novo:"Novo lançamento",ia:"Prompt da IA",ajustes:"Ajustes"};
document.querySelectorAll("nav.abas button").forEach(b=>b.insertAdjacentHTML("afterbegin",ic(b.dataset.ic)));
function irAba(a){ABA=a;document.querySelectorAll("nav.abas button").forEach(b=>b.setAttribute("aria-selected",b.dataset.aba===a));
  document.querySelectorAll("main>section").forEach(s=>s.classList.toggle("oculto",s.id!=="aba-"+a));$("#tituloAba").textContent=TITULOS[a];renderAba();window.scrollTo(0,0)}
function renderAba(){({painel:renderPainel,lanc:renderLanc,sub:renderSub,novo:renderNovo,ia:renderIA,ajustes:renderAjustes})[ABA]()}
function renderTudo(){$("#mesLbl").textContent=mesLabel(S.mes);$("#quem").textContent=CFG.modo==="onedrive"?S.usuario:"Modo de teste";renderAba()}
document.querySelectorAll("nav.abas button").forEach(b=>b.onclick=()=>irAba(b.dataset.aba));
$("#mesAnt").onclick=()=>{S.mes=addMes(S.mes,-1);renderTudo()};$("#mesProx").onclick=()=>{S.mes=addMes(S.mes,1);renderTudo()};
async function iniciar(){
  try{
    if(CFG.modo==="onedrive"){$("#aba-painel").innerHTML=`<div class="painel">Conectando ao OneDrive…</div>`;
      const conta=await OneDrive.login();if(!conta)return;await OneDrive.init()}
    await B().carregar();invalida();renderTudo();
  }catch(e){console.error(e);toast(e.message,7000);ABA="ajustes";irAba("ajustes")}
}
iniciar();
</script>
